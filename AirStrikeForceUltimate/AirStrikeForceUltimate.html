<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Strike Force Ultimate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #001a33 0%, #003366 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(to bottom, #000033 0%, #000066 50%, #003366 100%);
            overflow: hidden;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .health-bar {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .heart {
            font-size: 24px;
        }

        .power-bar {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .bolt {
            font-size: 24px;
            color: #ffff00;
        }

        #startScreen, #gameOverScreen, #levelClearScreen, #bossWarningScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            color: white;
        }

        #startScreen h1 {
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 20px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        #startScreen p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff, 0 0 40px #00ffff; }
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(to bottom, #00cc00 0%, #008800 100%);
            color: white;
            border: 3px solid #00ff00;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
            transition: all 0.3s;
            pointer-events: all;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 255, 0, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #bossWarningScreen {
            animation: warningBlink 0.5s ease-in-out infinite;
        }

        @keyframes warningBlink {
            0%, 100% { background: rgba(139, 0, 0, 0.9); }
            50% { background: rgba(255, 0, 0, 0.9); }
        }

        #bossWarningScreen h2 {
            font-size: 42px;
            color: #ffff00;
            margin-bottom: 20px;
        }

        #bossWarningScreen p {
            font-size: 32px;
            color: white;
        }

        #levelClearScreen h2 {
            font-size: 42px;
            color: #00ff00;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff00;
        }

        #gameOverScreen h2 {
            font-size: 42px;
            color: #ff0000;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        #leaderboardSection {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
        }

        #leaderboardSection h3 {
            color: #00ffff;
            margin-bottom: 15px;
            text-align: center;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 16px;
        }

        .leaderboard-entry.highlight {
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }

        #seedDisplay {
            font-size: 14px;
            color: #aaaaaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="stat-row">
                <span>LEVEL: <span id="levelDisplay">1</span></span>
                <span>SKOR: <span id="scoreDisplay">0</span></span>
            </div>
            
            <div class="stat-row">
                <div class="health-bar">
                    <span>HP:</span>
                    <span id="healthDisplay"></span>
                </div>
                <div class="power-bar">
                    <span id="powerDisplay"></span>
                </div>
            </div>
        </div>

        <div id="startScreen">
            <h1>AIR STRIKE</h1>
            <p>Selesaikan 5 Level untuk menang!</p>
            <p style="font-size: 16px; color: #aaa;">Gunakan mouse/touch untuk bergerak</p>
            <button class="btn" onclick="startGame()">MULAI</button>
            <div id="seedDisplay">World Seed: <span id="seedValue"></span></div>
            <div id="leaderboardSection" class="hidden">
                <h3>🏆 TOP PLAYERS 🏆</h3>
                <div id="leaderboardList"></div>
            </div>
        </div>

        <div id="bossWarningScreen" class="hidden">
            <h2>⚠️ WARNING! ⚠️</h2>
            <p>BOSS MENDEKAT</p>
        </div>

        <div id="levelClearScreen" class="hidden">
            <h2>LEVEL CLEAR!</h2>
            <p id="levelClearMessage">Bersiap untuk Level selanjutnya...</p>
            <p style="font-size: 20px; margin-top: 10px; color: #ffff00;">HP FULL RESTORED!</p>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h2>GAME OVER</h2>
            <p style="font-size: 24px; margin-bottom: 10px;">Level Tercapai: <span id="finalLevel">0</span></p>
            <p style="font-size: 24px; margin-bottom: 30px;">Skor Akhir: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">MAIN LAGI</button>
            <div id="gameOverLeaderboard" style="margin-top: 20px;">
                <h3 style="color: #00ffff;">🏆 TOP PLAYERS 🏆</h3>
                <div id="gameOverLeaderboardList"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== KONFIGURASI GOOGLE SHEETS ====================
        const SHEET_CONFIG = {
            scriptUrl: '', // MASUKKAN URL GOOGLE APPS SCRIPT DI SINI
            sheetName: 'AirStrikeScores'
        };

        // ==================== AUDIO MANAGER ====================
        const AudioManager = {
            sounds: {
                planeEnter: null,  // Suara pesawat masuk
                shoot: null,
                explosion: null,
                powerup: null,
                bossWarning: null,
                levelClear: null,
                gameOver: null
            },

            init() {
                // Inisialisasi semua audio (akan diganti dengan URL custom nanti)
                // Untuk sementara gunakan data URI kosong atau Web Audio API
                Object.keys(this.sounds).forEach(key => {
                    this.sounds[key] = new Audio();
                    this.sounds[key].volume = 0.3;
                });
            },

            setSound(soundName, url) {
                if (this.sounds[soundName]) {
                    this.sounds[soundName].src = url;
                }
            },

            play(soundName) {
                if (this.sounds[soundName] && this.sounds[soundName].src) {
                    const sound = this.sounds[soundName].cloneNode();
                    sound.volume = this.sounds[soundName].volume;
                    sound.play().catch(e => console.log('Audio play failed:', e));
                }
            }
        };

        // ==================== GAME STATE ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = {
            running: false,
            level: 1,
            score: 0,
            playerHealth: 5,
            maxHealth: 5,
            powerLevel: 0,
            maxPower: 5,
            isBossLevel: false,
            isTransitioning: false,
            seed: Date.now(),
            playerName: 'Player'
        };

        let player = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            speed: 5,
            isEntering: false,
            enterY: 0
        };

        let bullets = [];
        let enemies = [];
        let powerups = [];
        let explosions = [];
        let boss = null;

        // ==================== CANVAS SETUP ====================
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 100;
            player.enterY = canvas.height + player.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==================== INPUT HANDLING ====================
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height - 100;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        });

        // ==================== GOOGLE SHEETS INTEGRATION ====================
        async function saveScoreToSheet(playerName, score, level, seed) {
            if (!SHEET_CONFIG.scriptUrl) {
                console.log('Google Sheets not configured');
                return;
            }

            try {
                const response = await fetch(SHEET_CONFIG.scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'saveScore',
                        sheetName: SHEET_CONFIG.sheetName,
                        playerName: playerName,
                        score: score,
                        level: level,
                        seed: seed,
                        timestamp: new Date().toISOString()
                    })
                });
                console.log('Score saved to Google Sheets');
            } catch (error) {
                console.error('Error saving to Google Sheets:', error);
            }
        }

        async function loadLeaderboard() {
            if (!SHEET_CONFIG.scriptUrl) {
                return [];
            }

            try {
                const response = await fetch(SHEET_CONFIG.scriptUrl + '?action=getScores&sheetName=' + SHEET_CONFIG.sheetName);
                const data = await response.json();
                return data.scores || [];
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                return [];
            }
        }

        function displayLeaderboard(containerId, scores, highlightScore = null) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';
            
            scores.slice(0, 10).forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-entry';
                
                if (highlightScore && entry.score === highlightScore && entry.level === gameState.level) {
                    div.classList.add('highlight');
                }
                
                div.innerHTML = `
                    <span>${index + 1}. ${entry.playerName}</span>
                    <span>Lvl ${entry.level} - ${entry.score}</span>
                `;
                container.appendChild(div);
            });
        }

        // ==================== PLANE ENTRANCE ANIMATION ====================
        function startPlaneEntrance(callback) {
            player.isEntering = true;
            player.enterY = canvas.height + player.height;
            player.y = player.enterY;
            gameState.isTransitioning = true;
            
            AudioManager.play('planeEnter');

            const entranceInterval = setInterval(() => {
                player.y -= 8;
                
                if (player.y <= canvas.height - 100) {
                    player.y = canvas.height - 100;
                    player.isEntering = false;
                    gameState.isTransitioning = false;
                    clearInterval(entranceInterval);
                    if (callback) callback();
                }
            }, 16);
        }

        // ==================== GAME INITIALIZATION ====================
        function startGame() {
            AudioManager.init();
            
            const name = prompt('Masukkan nama Anda:', 'Player');
            if (name) gameState.playerName = name;
            
            gameState.seed = Date.now();
            document.getElementById('seedValue').textContent = gameState.seed;
            
            document.getElementById('startScreen').classList.add('hidden');
            
            resetGame();
            startPlaneEntrance(() => {
                gameState.running = true;
                gameLoop();
            });
        }

        function resetGame() {
            gameState.level = 1;
            gameState.score = 0;
            gameState.playerHealth = gameState.maxHealth;
            gameState.powerLevel = 0;
            gameState.isBossLevel = false;
            
            bullets = [];
            enemies = [];
            powerups = [];
            explosions = [];
            boss = null;
            
            updateUI();
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            
            loadLeaderboard().then(scores => {
                if (scores.length > 0) {
                    document.getElementById('leaderboardSection').classList.remove('hidden');
                    displayLeaderboard('leaderboardList', scores);
                }
            });
        }

        // ==================== LEVEL MANAGEMENT ====================
        function nextLevel() {
            gameState.level++;
            gameState.playerHealth = gameState.maxHealth; // FULL HP DI AWAL LEVEL
            gameState.powerLevel = 0;
            
            bullets = [];
            enemies = [];
            powerups = [];
            explosions = [];
            boss = null;
            
            updateUI();
            
            if (gameState.level > 5) {
                winGame();
                return;
            }
            
            gameState.isBossLevel = (gameState.level % 5 === 0);
            
            if (gameState.isBossLevel) {
                showBossWarning();
            } else {
                showLevelClear();
            }
        }

        function showBossWarning() {
            gameState.running = false;
            document.getElementById('bossWarningScreen').classList.remove('hidden');
            AudioManager.play('bossWarning');

            setTimeout(() => {
                document.getElementById('bossWarningScreen').classList.add('hidden');
                startPlaneEntrance(() => {
                    spawnBoss();
                    gameState.running = true;
                });
            }, 2000);
        }

        function showLevelClear() {
            gameState.running = false;
            document.getElementById('levelClearMessage').textContent = 
                `Level ${gameState.level - 1} Clear! Bersiap untuk Level ${gameState.level}...`;
            document.getElementById('levelClearScreen').classList.remove('hidden');
            AudioManager.play('levelClear');
            
            setTimeout(() => {
                document.getElementById('levelClearScreen').classList.add('hidden');
                startPlaneEntrance(() => {
                    gameState.running = true;
                });
            }, 2500);
        }

        function winGame() {
            gameState.running = false;
            saveScoreToSheet(gameState.playerName, gameState.score, gameState.level - 1, gameState.seed);
            
            document.getElementById('finalLevel').textContent = gameState.level - 1;
            document.getElementById('finalScore').textContent = gameState.score;
            
            loadLeaderboard().then(scores => {
                displayLeaderboard('gameOverLeaderboardList', scores, gameState.score);
            });
            
            document.getElementById('gameOverScreen').querySelector('h2').textContent = 'KEMENANGAN!';
            document.getElementById('gameOverScreen').querySelector('h2').style.color = '#00ff00';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            AudioManager.play('levelClear');
        }

        function gameOver() {
            gameState.running = false;
            saveScoreToSheet(gameState.playerName, gameState.score, gameState.level, gameState.seed);
            
            document.getElementById('finalLevel').textContent = gameState.level;
            document.getElementById('finalScore').textContent = gameState.score;
            
            loadLeaderboard().then(scores => {
                displayLeaderboard('gameOverLeaderboardList', scores, gameState.score);
            });
            
            document.getElementById('gameOverScreen').querySelector('h2').textContent = 'GAME OVER';
            document.getElementById('gameOverScreen').querySelector('h2').style.color = '#ff0000';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            AudioManager.play('gameOver');
        }

        // ==================== UI UPDATE ====================
        function updateUI() {
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('scoreDisplay').textContent = gameState.score;
            
            let healthHTML = '';
            for (let i = 0; i < gameState.maxHealth; i++) {
                healthHTML += i < gameState.playerHealth ? '❤️' : '🖤';
            }
            document.getElementById('healthDisplay').innerHTML = healthHTML;
            
            let powerHTML = '';
            for (let i = 0; i < gameState.maxPower; i++) {
                powerHTML += i < gameState.powerLevel ? '⚡' : '○';
            }
            document.getElementById('powerDisplay').innerHTML = powerHTML;
        }

        // ==================== GAME OBJECTS ====================
        function createBullet(x, y, speedY = -10) {
            bullets.push({ x, y, width: 4, height: 15, speedY, color: '#ffff00' });
        }

        function createEnemy(x, y, type = 'normal') {
            const enemy = {
                x, y,
                width: type === 'normal' ? 35 : 50,
                height: type === 'normal' ? 35 : 50,
                speedY: 1 + gameState.level * 0.3,
                health: type === 'normal' ? 1 : 3,
                type,
                color: type === 'normal' ? '#ff0000' : '#ff00ff',
                shootCooldown: 0
            };
            enemies.push(enemy);
        }

        function spawnBoss() {
            boss = {
                x: canvas.width / 2 - 60,
                y: 50,
                width: 120,
                height: 120,
                health: 50 + gameState.level * 10,
                maxHealth: 50 + gameState.level * 10,
                speedX: 2,
                shootCooldown: 0,
                pattern: 0
            };
        }

        function createPowerup(x, y) {
            powerups.push({
                x, y,
                width: 25,
                height: 25,
                speedY: 2,
                type: Math.random() > 0.5 ? 'power' : 'health'
            });
        }

        function createExplosion(x, y, size = 30) {
            explosions.push({
                x, y,
                size,
                maxSize: size * 2,
                alpha: 1,
                growth: 2
            });
            AudioManager.play('explosion');
        }

        // ==================== ENEMY SPAWNING ====================
        let spawnTimer = 0;
        function spawnEnemies() {
            if (gameState.isBossLevel || gameState.isTransitioning) return;
            
            spawnTimer++;
            const spawnRate = Math.max(60 - gameState.level * 5, 20);
            
            if (spawnTimer >= spawnRate) {
                spawnTimer = 0;
                const x = Math.random() * (canvas.width - 50) + 25;
                const type = Math.random() > 0.85 ? 'strong' : 'normal';
                createEnemy(x, -50, type);
            }
        }

        // ==================== PLAYER UPDATE ====================
        function updatePlayer() {
            if (player.isEntering) return;
            
            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > player.speed) {
                player.x += (dx / distance) * player.speed;
                player.y += (dy / distance) * player.speed;
            }
            
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        }
